name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Imposta nome Worker da secret
        env:
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "CLOUDFLARE_PROJECT_NAME è obbligatorio" >&2
            exit 1
          fi
          node scripts/patch-wrangler-name.mjs "$CLOUDFLARE_PROJECT_NAME"
      - run: npm run build
      - name: Deploy Worker + assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN è obbligatorio per /admin" >&2
            exit 1
          fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config dist/convivio_catering/wrangler.json
          npx wrangler deploy --config dist/convivio_catering/wrangler.json